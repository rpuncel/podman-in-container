# Pin podman's firewall path to the legacy iptables backend, per ADR-0002.
#
# Two caveats, both measured rather than assumed (docs/machine-image.md):
#   - This key configures *netavark*. Ubuntu 24.04 ships podman 4.9.3 on the CNI
#     backend and packages no netavark, so today it is inert; the legacy backend is
#     actually selected by the `iptables` alternative, the binary CNI shells out to.
#     Stated anyway so the machine stays correct when podman >= 5 (netavark by
#     default) lands -- the upgrade ADR-0004 anticipates.
#   - ADR-0002's reason for wanting legacy (no nftables in the guest kernel) did not
#     reproduce: iptables-nft works there too.
[network]
firewall_driver = "iptables"
