# Inner podman storage driver (ADR-0007).
#
# Native overlay with no mount_program: the guest kernel permits an unprivileged
# overlay mount inside a user namespace, so rootless podman drives overlayfs
# directly and does not need the fuse-overlayfs hop that nested podman normally
# pays for. Stated explicitly rather than left to podman's default because *not*
# setting mount_program is the decision.
#
# metacopy is deliberately absent: it needs trusted.* xattrs, which an
# unprivileged user namespace cannot set, so rootless podman ignores it anyway.
#
# runroot/graphroot repeat podman's own rootful defaults, and are not optional:
# once a [storage] section exists, rootful podman requires them explicitly and
# otherwise fails every command with "runroot must be set". Rootless podman
# ignores both and derives its own paths under the user's home.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
